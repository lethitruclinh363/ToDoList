spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/todolist
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8082


jwt:
  secret: MySuperSecretKey123456789012345678901234567890
  expiration: 604800000
